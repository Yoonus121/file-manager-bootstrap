<!DOCTYPE html>
<html lang="en-IN">

<head>
    <meta charset="UTF-8">
    <title>FM_Client</title>
    <link rel="icon" type="image/x-icon" href="file_manager.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
    
    body{
        padding: 0;
        margin: 0;
        background-color: #10192e;
        font-family: 'IBM Plex Sans', sans-serif;
    }

    .header{
        display: flex;
        align-items: center;
        height: 40px;
        align-items: auto;
        color: #FFFFFF;
        background-color: #16223b;
        border-bottom: 1px solid #2a3654 ;
    }

    .header h2 {
        font-family: 'Fraunces', serif;
        font-style: italic;
        font-weight: 600;
        font-size: 19px;
        color: #F3EFE4;
    }

    .header img{
        float: left;
        margin: 0 15px 0 10px;
    }

    .header .header_btn{
        margin-left: auto;
    }

    .header .header_btn button{
        border: none;
        margin: 5px;
        height: 25px;
        width: 100px;
        border-radius: 5px;
        background-color:#16223b;
        color: #B8892B;
        
    }
    
    .register_card{
        position: relative;
        margin: auto;
        background-color: #F4EEDF;
        color: #1F2436;
        width: 100%;
        max-width: 400px;
        border-radius: 12px;
        border: 1px solid #2D3F63;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        padding: 32px;

    }

    .register_card::before {
        content: "";
        position: absolute;
        top: -16px;
        left: 22px;
        width: 30px;
        height: 30px;
        background: #B8892B;
        transform: rotate(45deg);
    }

    .register_card p.section-title {
        font-family: 'Fraunces', serif;
        font-weight: 600;
        font-size: 18px;
        margin-bottom: 20px;
    }

    .register_card p {
        color: #1F2436;
    }
    

    input[type="text"],
    input[type="password"] {
        font-family: inherit;
        font-size: 12px;
        color: #1F2436;
        background: #FFFFFF;
        border: 1px solid #C9BE9E;
        border-radius: 4px;
        padding: 7px 10px;
        outline: none;
        width: 100%;
        box-sizing: border-box;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
        border-color: #B8892B;
    }

    input[type="submit"] {
        font-family: inherit;
        background: #B8892B;
        color: #1F2436;
        border: none;
        border-radius: 4px;
        padding: 9px 0;
        margin-top: 4px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
    }

    input[type="submit"]:hover {
        background: #A87B22;
    }

    #registerForm{
        display: flex;
        flex-direction: column;
        
    }

    h1{
        color: aliceblue;
    }
    p{
        color:aliceblue;
    }
</style>
</head>

<body>
    <div class = "header">
        <img src="file_manager.png" alt="logo" height="35px" width="35px">
        <h2>FILE MANAGER</h2>
        <div class="header_btn">
            <button class="login_btn" onclick="goToLogin()">LOGIN</button> 
        </div>
    </div>
    <br>

    <div class ="register_card">
        <p class="section-title">REGISTER</p>
        <form id="registerForm">
            <p>enter fullname</p>
            <input type="text" id="fullname">
            <p>enter gmail</p>
            <input type="text" id="email">
            <p>enter password</p>
            <input type="password" id="password">
            <input type="submit">
        </form>
    </div>
    <p id="response"></p>

<script>
const registerForm = document.getElementById("registerForm");

function goToLogin() {
    window.location.href = "login.html";
}


async function handleRegisterSubmit(event){
    event.preventDefault();
    
    const fullname= document.getElementById("fullname").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;


    if (!fullname|| !email || !password) {
        document.getElementById("response").innerHTML = "All fields are required";
        return;
    }
    if (!email.includes("@")) {
        document.getElementById("response").innerHTML = "Please enter a valid email";
        return;
    }

    if (password.length < 6) {
        document.getElementById("response").innerHTML = "Password must be at least 6 characters";
        return;
    }

    
    const response = await fetch("http://localhost:3000/api/register", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({fname:fullname,mail:email,pass:password})
    });

    const data = await response.json();

    if (response.status === 200) {
        window.location.href = "login.html";
    } else {
        document.getElementById("response").innerHTML = data.message;
    }
}
registerForm.addEventListener("submit", handleRegisterSubmit);
</script>
</body>
</html>
