<!DOCTYPE html>
<html lang="en-IN">

<head>
    <meta charset="UTF-8">
    <title>FM_Client</title>
    <link rel="icon" type="image/x-icon" href="images/file_manager_icon.png">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --gold: #b8892b;
            --gold-dark: #a37722;
            --navy-900: #0f1c3f;
            --navy-800: #152a5c;
            --text-dark: #14224a;
            --muted: #6b7a99;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #10192e;
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
        }

        .app-shell {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            background: var(--navy-900);
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .topbar .brand {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .logout-btn {
            background: none;
            border: 0;
            color: var(--gold);
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 8px;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #fff;
            color: var(--navy-800);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .sidebar {
            background: linear-gradient(180deg, #0f1c3f 0%, #0c1733 100%);
            color: #fff;
        }

        .side-hero {
            max-width: 100%;
            height: auto;
            max-height: 260px;
            object-fit: contain;
        }

        .side-title {
            font-weight: 700;
            font-size: 1.5rem;
            line-height: 1.3;
            margin-bottom: 12px;
        }

        .side-text {
            color: #c4d0ec;
            font-size: .95rem;
        }

        .side-nav-item {
            background: rgba(255, 255, 255, 0.08);
            border-left: 4px solid var(--gold);
            color: var(--gold);
            font-weight: 600;
            padding: 14px 16px;
            border-radius: 8px;
            text-decoration: none;
        }

        .side-nav-item:hover {
            background: rgba(255, 255, 255, 0.14);
            color: var(--gold);
        }

        .main-card {
            background: #faf8f3;
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .icon-circle-gold {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--gold);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            flex-shrink: 0;
        }

        .page-title {
            color: var(--text-dark);
            font-weight: 700;
            margin: 0;
        }

        .page-subtitle {
            color: var(--muted);
        }

        .drop-zone {
            border: 2px dashed #dccb9b;
            border-radius: 12px;
            background: #fbf8f0;
            padding: 40px 20px;
        }

        .drop-icon {
            font-size: 3.5rem;
            color: var(--gold);
        }

        .drop-zone.drag-over {
            border-color: var(--gold);
            background: #f6efdb;
        }

        .btn-gold {
            background: var(--gold);
            border: 0;
            color: #fff;
            font-weight: 600;
            padding: 10px 28px;
            border-radius: 8px;
        }

        .btn-gold:hover {
            background: var(--gold-dark);
            color: #fff;
        }

        .file-card {
            background: #fff;
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 2px 10px rgba(20, 34, 74, 0.06);
        }

        .input-group-text {
            background: #fff;
            border-color: #e3e8f2;
            color: var(--navy-800);
        }

        .form-control,
        .form-select {
            border-color: #e3e8f2;
            font-size: 0.9rem;
            padding: 10px 12px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 .2rem rgba(184, 137, 43, 0.2);
        }

        @media(min-width: 768px) {
            .form-select {
                min-width: 170px;
            }
        }

        .files-table {
            --bs-table-bg: transparent;
            font-size: .9rem;
        }

        .files-table thead th {
            background: #f3f6fc;
            color: var(--muted);
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: .04em;
            border-bottom: 0;
            padding: 14px 16px;
        }

        .files-table thead th:first-child {
            border-radius: 8px 0 0 8px;
        }

        .files-table thead th:last-child {
            border-radius: 0 8px 8px 0;
        }

        .files-table tbody td {
            padding: 14px 16px;
            color: var(--text-dark);
            border-color: #eef1f7;
        }

        .file-icon {
            font-size: 1.8rem;
        }

        .file-name {
            font-weight: 500;
        }

        .cell-muted {
            color: var(--muted) !important;
        }

        .btn-outline-action {
            background: #fff;
            border: 1px solid #dfe5f0;
            color: var(--gold);
            font-weight: 600;
        }

        .btn-outline-action:hover {
            background: #fbf8f0;
            border-color: var(--gold);
            color: var(--gold-dark);
        }

        .btn-gold-sm {
            background: var(--gold);
            border: 1px solid var(--gold);
            color: #fff;
            font-weight: 600;
        }

        .btn-gold-sm:hover {
            background: var(--gold-dark);
            border-color: var(--gold-dark);
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="app-shell">
        <div class="topbar d-flex align-items-center justify-content-between px-3 py-3">
            <div class="d-flex align-items-center gap-2">
                <img src="images/file_manager_icon.png" alt="logo" height="35px" width="35px">
                <span class="brand">File Manager</span>
            </div>

            <button type="button" class="logout-btn d-flex align-items-center gap-2" onclick="logout()">
                <span class="avatar"><i class="bi bi-person-fill"></i></span>
                <span>Logout</span>
            </button>
        </div>

        <div class="row g-0 flex-grow-1">

            <aside class="col-lg-3 sidebar p-4 d-flex flex-column">
                <div class="text-center mb-3">
                    <img src="images/file_manager_hero_illustration.png" alt="hero_img" class="side-hero">
                </div>

                <h3 class="side-title">Upload &amp; Manage<br>Your Files</h3>
                <p class="side-text">Keep your important files safe and accessible anytime, anywhere.</p>
                <a href="#" class="side-nav-item d-flex align-items-center gap-2 mt-3">
                    <i class="bi bi-cloud-upload-fill"></i>
                    <span>Upload</span>
                </a>
            </aside>


            <main class="col-lg-9 p-3 p-lg-4">
                <div class="main-card">
                    <div class="d-flex align-items-center gap-3 mb-4">
                        <div class="icon-circle-gold"><i class="bi bi-cloud-arrow-up-fill"></i></div>
                        <div>
                            <h4 class="page-title">Upload Files</h4>
                            <div class="page-subtitle">Select files from your device or click the button below to
                                upload.</div>
                        </div>
                    </div>

                    <div class="drop-zone text-center">
                        <i class="bi bi-cloud-arrow-up-fill drop-icon"></i>
                        <div class="mt-3">
                            <input type="file" id="fileInput" class="d-none" multiple>
                            <button type="button" class="btn btn-gold"
                                onclick="document.getElementById('fileInput').click();">
                                <i class="bi bi-file-earmark-plus me-2"></i>Add File
                            </button>
                        </div>
                    </div>

                    <div class="file-card mt-4">
                        <div class="row g-2 mb-3">
                            <div class="col-12 col-md">
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                                    <input type="text" class="form-control" id="searchInput"
                                        placeholder="Search by filename...">
                                </div>
                            </div>

                            <div class="col-12 col-md-auto">
                                <select id="sortselect" class="form-select">
                                    <option value="newest">Newest First</option>
                                    <option value="oldest">Oldest First</option>
                                    <option value="az">A-Z</option>
                                    <option value="za">Z-A</option>
                                </select>
                            </div>
                        </div>

                        <div id="response" class="alert d-none py-2 small" role="alert"></div>
                        <div id="spinner" class="text-center py-2" style="display:none;">
                            <span class="spinner-border spinner-border-sm" style="color: var(--gold);"
                                role="status"></span>
                            <span class="ms-2 cell-muted">Loading...</span>
                        </div>

                        <div class="table-responsive">
                            <table class="table files-table align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>FILE NAME</th>
                                        <th>SIZE</th>
                                        <th>UPLOADED AT</th>
                                        <th class="text-center">ACTIONS</th>
                                    </tr>
                                </thead>
                                <tbody id="filelist"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById("fileInput");
        const token = localStorage.getItem('authentication') || sessionStorage.getItem("authentication");
        let cleanupTimerId;
        let allfiles = [];


        if (!token) {
            window.location.href = "login.html";
        }


        function logout() {
            clearTimeout(cleanupTimerId);
            localStorage.removeItem('authentication');
            sessionStorage.removeItem("authentication");
            window.location.href = "login.html";
        }


        function scheduleTokenCleanup() {
            try {
                const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
                const payload = JSON.parse(atob(base64));
                const expiryTimeMs = payload.exp * 1000;
                const remainingMs = expiryTimeMs - Date.now();

                if (remainingMs <= 0) {
                    logout();
                } else {
                    cleanupTimerId = setTimeout(logout, remainingMs);
                }
            } catch (err) {
                logout();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        function getFileIcon(name) {
            const ext = name.includes(".") ? name.split(".").pop().toLowerCase() : "";

            if (ext === "pdf") return { icon: "bi-file-earmark-pdf-fill", color: "#e53935" };
            if (["jpg", "jpeg", "png", "gif", "webp", "svg"].includes(ext)) return { icon: "bi-file-earmark-image-fill", color: "#1e9bd7" };
            if (["doc", "docx", "txt"].includes(ext)) return { icon: "bi-file-earmark-text-fill", color: "#2b6cb0" };
            if (["xls", "xlsx", "csv"].includes(ext)) return { icon: "bi-file-earmark-spreadsheet-fill", color: "#2e9e5b" };
            if (["zip", "rar", "7z"].includes(ext)) return { icon: "bi-file-earmark-zip-fill", color: "#8e6b2f" };
            if (["mp4", "mkv", "mov", "avi"].includes(ext)) return { icon: "bi-file-earmark-play-fill", color: "#7b4bc4" };
            if (["mp3", "wav"].includes(ext)) return { icon: "bi-file-earmark-music-fill", color: "#d6336c" };
            return { icon: "bi-file-earmark-fill", color: "#f5a623" };
        }

        const responseBox = document.getElementById("response");
        let messageTimerId;

        function showMessage(msg, isError = false) {
            clearTimeout(messageTimerId);
            responseBox.textContent = msg;
            responseBox.className = "alert py-2 small " + (isError ? "alert-danger" : "alert-success");
            messageTimerId = setTimeout(() => responseBox.classList.add("d-none"), 4000);
        }


        fileInput.addEventListener("change", handleUpload);

        const dropZone = document.querySelector(".drop-zone");

        ["dragenter", "dragover"].forEach(evt =>
            dropZone.addEventListener(evt, (e) => {
            e.preventDefault();
            dropZone.classList.add("drag-over");
            })
        );

        ["dragleave", "drop"].forEach(evt =>
            dropZone.addEventListener(evt, (e) => {
            e.preventDefault();
            dropZone.classList.remove("drag-over");
            })
        );

        dropZone.addEventListener("drop", (e) => {
            fileInput.files = e.dataTransfer.files;
            handleUpload(e);
        });



        document.getElementById("sortselect").addEventListener("change", (event) => {
            renderFileList(event.target.value);
        });

        document.getElementById("searchInput").addEventListener("input", () => {
            renderFileList(document.getElementById("sortselect").value);
        });



        async function loadfilelist() {
            document.getElementById("spinner").style.display = "block";
            try {
                const response = await fetch("http://localhost:3000/api/files", {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                if (response.status === 401) {
                    logout();
                    return;
                }

                const data = await response.json();
                allfiles = data.files || [];
                renderFileList(document.getElementById("sortselect").value);
            } finally {
                document.getElementById("spinner").style.display = "none";
            }
        }


        function renderFileList(sorttype) {
            const searchText = document.getElementById("searchInput").value;

            const filtered = allfiles.filter(file =>
                file.original_name.toLowerCase().includes(searchText.toLowerCase())
            );

            if (sorttype === "newest") {
                filtered.sort((a, b) => new Date(b.uploaded_at) - new Date(a.uploaded_at));
            } else if (sorttype === "oldest") {
                filtered.sort((a, b) => new Date(a.uploaded_at) - new Date(b.uploaded_at));
            } else if (sorttype === "az") {
                filtered.sort((a, b) => a.original_name.localeCompare(b.original_name));
            } else if (sorttype === "za") {
                filtered.sort((a, b) => b.original_name.localeCompare(a.original_name));
            }

            const tbody = document.getElementById("filelist");
            let rowHTML = "";

            if (filtered.length === 0) {
                rowHTML = `<tr><td colspan="4" class="text-center py-4 cell-muted">No files found</td></tr>`;
            }

            for (const file of filtered) {
                let sizeInMb = file.size / (1024 * 1024);
                let uploadDate = new Date(file.uploaded_at).toLocaleDateString();
                const { icon, color } = getFileIcon(file.original_name);

                rowHTML += `<tr>
            <td>
                <div class="d-flex align-items-center gap-3">
                    <i class="bi ${icon} file-icon" style="color:${color}"></i>
                    <span class="file-name">${escapeHtml(file.original_name)}</span>
                </div>
            </td>
            <td class="cell-muted">${sizeInMb.toFixed(2)}MB</td>
            <td class="cell-muted">${uploadDate}</td>
            <td class="text-end text-nowrap">
                <button class="btn btn-sm btn-outline-action me-1" onclick="renameFile(${file.id})">
                    <i class="bi bi-pencil-fill me-1"></i>Rename
                </button>
                <button class="btn btn-sm btn-gold-sm me-1" onclick="downloadFile(${file.id})">
                    <i class="bi bi-download me-1"></i>Download
                </button>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteFile(${file.id})" title="Delete">
                    <i class="bi bi-trash-fill"></i>
                </button>
            </td></tr>`;
            }
            tbody.innerHTML = rowHTML;
        }



        async function handleUpload(event) {
            event.preventDefault();

            const selectedFiles = fileInput.files;
            const formData = new FormData();
            for (const file of selectedFiles) {
                formData.append("files", file);
            }

            document.getElementById("spinner").style.display = "block";
            try {
                const response = await fetch("http://localhost:3000/api/upload", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + token
                    },
                    body: formData
                });

                const data = await response.json();
                showMessage(data.message, !response.ok);

                await loadfilelist();
            } finally {
                document.getElementById("spinner").style.display = "none";
                fileInput.value = "";
            }
        }



        async function deleteFile(id) {
            if (!confirm("Delete this file?")) {
                return;
            }
            const response = await fetch(`http://localhost:3000/api/files/${id}`, {
                method: "DELETE",
                headers: {
                    "Authorization": "Bearer " + token
                }
            });
            const data = await response.json();
            showMessage(data.message, !response.ok);
            await loadfilelist();
        }


        async function renameFile(id) {
            const newName = prompt("Enter new file name:");
            if (!newName) {
                return;
            }

            const response = await fetch(`http://localhost:3000/api/files/${id}`, {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({ new_name: newName })
            });
            const data = await response.json();
            showMessage(data.message, !response.ok);
            await loadfilelist();
        }


        async function downloadFile(id) {
            const file = allfiles.find(f => f.id === id);
            const response = await fetch(`http://localhost:3000/api/files/${id}/download`, {
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            if (!response.ok) {
                showMessage("Download failed", true);
                return;
            }

            const blob = await response.blob();
            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");
            link.href = url;
            link.download = file.original_name;
            link.click();

            URL.revokeObjectURL(url);
        }

        scheduleTokenCleanup();
        loadfilelist();

        window.addEventListener("unhandledrejection", () => {
            showMessage("Could not reach the server. Please try again.", true);
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
