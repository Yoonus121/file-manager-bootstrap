<!DOCTYPE html>
<html lang="en-IN">

<head>
    <meta charset="UTF-8">
    <title>File Manager</title>
    <link rel="icon" type="image/x-icon" href="file_manager.ico">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"> 

<style>
    
    body{
        margin: 0;
        min-height: 100vh;
        background: #e9eef7;
        font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
    }

    .topbar{
        background: #0f1c3f;
        color: #fff;
    }

    .topbar .brand{
        font-weight: 700;
        font-size: 1.1rem;
    }

    .topbar .small-text{
        color: #dbe3f5;
        font-size: 0.8rem;
    }

    .topbar a{
        color: #f5a623;
        font-weight: 600;
        text-decoration: none;
    }

    .topbar a:hover{
        color: #ffc457;
    }

    .app-shell {
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #fff;
    }

    .hero-panel{
        background: linear-gradient(160deg, #152a5c 0%, #0f1c3f 100%);
        color: #fff;
        padding: 40px 36px;
    }

    .form-panel{
        background: linear-gradient(180deg, #f4f7fd 0%, #eaf0fa 100%);
        padding: 36px 32px;
    }

    .hero-panel img.hero-img {
        max-width: 100%;
        height: auto;
        max-height: 380px;
        object-fit: contain;
    }

    .hero-panel h2{
        font-weight: 700;
        font-size: 1.9rem;
        line-height: 1.25;
    }

    .hero-panel p{
        color: #c4d0ec;
        font-size: 1rem;
    }
    
    .login-card {
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(20, 34, 74, 0.10);
        padding: 28px;
        max-width: 460px;
        margin: 0 auto;
    }

    .icon-circle{
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: #e3edff;
        color: #1b3675;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        flex-shrink: 0;
    }

    .login-card h4{
        color: #14224a;
        font-weight: 700;
        margin: 0;
    }

    .login-card .subtitle {
        color: #6b7a99;
        font-size: 0.85rem;
    }
    
    .form-label{
        color: #14224a;
        font-weight: 600;
        font-size: 0.85rem;
        margin-bottom: 6px;
    }

    .input-group-text {
        background: #eef3fc;
        border-color: #d6dff0;
        color: #1b3675;
    }

    .form-control {
        border-color: #d6dff0;
        font-size: .9rem;
        padding: 10px 12px;
    }

    .form-control:focus {
        border-color: #f5a623;
        box-shadow: 0 0 0 .2rem rgba(245, 166, 35, .2);
    }
    

    .btn-login{
        background: linear-gradient(180deg, #fbbd3d 0%, #e0900f 100%);
        border: 0;
        color: #fff;
        font-weight: 600;
        padding: 11px;
        border-radius: 8px;
    }

    .btn-login:hover{
        background: linear-gradient(180deg, #f5b02a 0%, #d18207 100%);
        color: #fff;
    }

    .form-check-label {
        color: #14224a;
        font-size: .85rem;
    }

    .form-check-input:checked {
        background-color: #f5a623;
        border-color: #f5a623;
    }

    .form-check-input:focus {
        border-color: #f5a623;
        box-shadow: 0 0 0 .2rem rgba(245, 166, 35, .2);
    }

    
</style>
</head>

<body>
<div class="app-shell">    
    <div class = "topbar d-flex align-items-center justify-content-between px-3 py-3">
        <div class="d-flex align-items-center gap-2">
            <img src="images/file_manager_icon.png" alt="logo" height="35px" width="35px">
            <span class="brand">File Manager</span>
        </div>
        <div class="small-text">
            Don't have an account?
            <a href="register.html">Register</a> 
        </div>
    </div>


    <div class="row g-0 flex-grow-1">
        <div class="col-md-6 hero-panel d-flex flex-column justify-content-between">
            <div class="text-center my-3">
                <img src="images/file_manager_hero_illustration.png" alt="hero_img" class="hero-img">
            </div>
            <div>
                <h2>Welcome Back!</h2>
                <p class="mb-0">Sign in to access your files<br>and continue where you left off.</p>
            </div>
        </div>

    <div class="col-md-6 form-panel d-flex align-items-center">
        <div class ="login-card w-100">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="icon-circle"><i class="bi bi-lock-fill"></i></div>
                <div>
                    <h4>Login</h4>
                    <div class="subtitle">Enter your credentials to continue.</div>
                </div>
            </div>

             <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                        <input type="email" class="form-control" id="email" placeholder="Enter Your Email">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="Enter Your Password">
                    </div>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>

                <div id="response" class="alert alert-danger py-2 small d-none" role="alert"></div>

                <button type="submit" class="btn btn-login w-100">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Login
                </button>
            </form>
        </div>
    </div>
    </div>

</div>
<script>
const loginForm = document.getElementById("loginForm");
const responseBox = document.getElementById("response");

function showMessage(msg) {
    responseBox.textContent = msg;
    responseBox.classList.remove("d-none");
}


async function handleLoginSubmit(event){
    event.preventDefault();
    responseBox.classList.add("d-none");

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!email || !password) {
        showMessage("All fields are required");
        return;
    }
    if (!email.includes("@")) {
        showMessage("Please enter a valid email");
        return;
    }

    try{
        const response = await fetch("http://localhost:3000/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({mail:email,pass:password})
        });

        const data = await response.json();
    
        if(data.token){
            const remember = document.getElementById("remember").checked;

            if (remember) {
                localStorage.setItem("authentication", data.token);
                sessionStorage.removeItem("authentication");
            } else {
                sessionStorage.setItem("authentication", data.token);
                localStorage.removeItem("authentication");
            }
            window.location.href = "upload.html";

        }else{
            showMessage(data.message);
        }
    }catch(err){
        showMessage("Could not reach the server. Please try again.");
    }
}
loginForm.addEventListener("submit", handleLoginSubmit);
</script>
</body>
</html>
